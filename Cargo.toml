[package]
name = "claude-gateway"
version = "0.1.0"
edition = "2021"
description = "Claude Code CLI 래핑 REST API 게이트웨이"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
